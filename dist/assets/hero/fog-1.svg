<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
  <defs>
    <radialGradient id="fogRose1" cx="30%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#E8B4B8" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#FF9933" stop-opacity="0.5" />
      <stop offset="85%" stop-color="#E2552B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1A0F0A" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="fogRose2" cx="75%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E8B4B8" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#FFAE73" stop-opacity="0.45" />
      <stop offset="80%" stop-color="#D4AF37" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1A0F0A" stop-opacity="0" />
    </radialGradient>
    <filter id="cloudBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <g filter="url(#cloudBlur)">
    <!-- Big mist billows -->
    <ellipse cx="400" cy="650" rx="600" ry="380" fill="url(#fogRose1)" />
    <ellipse cx="1400" cy="500" rx="700" ry="420" fill="url(#fogRose2)" />
    <ellipse cx="950" cy="750" rx="650" ry="350" fill="url(#fogRose1)" opacity="0.75" />
  </g>
</svg>

