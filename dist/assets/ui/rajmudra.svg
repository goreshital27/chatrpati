<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8F6B14" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F7E27A" />
      <stop offset="75%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8F6B14" />
    </linearGradient>
    <radialGradient id="sealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#1A0F0A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#4A0D0D" stop-opacity="1" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Octagon -->
  <polygon points="146,20 354,20 480,146 480,354 354,480 146,480 20,354 20,146" 
           fill="url(#sealGlow)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#glow)" />

  <!-- Inner Octagon Border -->
  <polygon points="152,36 348,36 464,152 464,348 348,464 152,464 36,348 36,152" 
           fill="none" stroke="#D4AF37" stroke-width="2.5" stroke-dasharray="8 4" />

  <!-- Corner Ornamental Dots -->
  <circle cx="146" cy="20" r="6" fill="#F7E27A" />
  <circle cx="354" cy="20" r="6" fill="#F7E27A" />
  <circle cx="480" cy="146" r="6" fill="#F7E27A" />
  <circle cx="480" cy="354" r="6" fill="#F7E27A" />
  <circle cx="354" cy="480" r="6" fill="#F7E27A" />
  <circle cx="146" cy="480" r="6" fill="#F7E27A" />
  <circle cx="20" cy="354" r="6" fill="#F7E27A" />
  <circle cx="20" cy="146" r="6" fill="#F7E27A" />

  <!-- Center Decorative Sun / Crescent -->
  <circle cx="250" cy="105" r="16" fill="url(#goldGrad)" opacity="0.9" />
  <path d="M236,105 A14,14 0 0,0 264,105 A11,11 0 0,1 236,105" fill="#4A0D0D" />

  <!-- Sanskrit Inscription Lines in Devanagari Calligraphy -->
  <g fill="url(#goldGrad)" font-family="'Yatra One', 'Tiro Devanagari Marathi', serif" text-anchor="middle" font-weight="700">
    <text x="250" y="165" font-size="29" letter-spacing="1">प्रतिपच्चन्द्रलेखेव</text>
    <text x="250" y="225" font-size="28" letter-spacing="1">वर्धिष्णुर्विश्ववन्दिता ।</text>
    <text x="250" y="285" font-size="28" letter-spacing="1">शाहसूनोः शिवस्यैषा</text>
    <text x="250" y="345" font-size="27" letter-spacing="1">मुद्रा भद्राय राजते ॥</text>
  </g>

  <!-- Bottom Lotus Crest -->
  <path d="M250,420 C230,405 210,410 200,430 C220,430 240,425 250,420 Z" fill="#D4AF37" />
  <path d="M250,420 C270,405 290,410 300,430 C280,430 260,425 250,420 Z" fill="#D4AF37" />
  <circle cx="250" cy="415" r="4" fill="#F7E27A" />
</svg>

